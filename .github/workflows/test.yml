name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10

    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm test --runInBand

  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - uses: pnpm/action-setup@v6
      with:
        version: 10

    - uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run typecheck
      run: pnpm run typecheck
